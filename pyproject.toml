[project]
name = "tiny-ticket-tracker"
version = "0.1.0"
description = "A small Jira-like ticket tracker for practicing AI-enabled delivery workflows."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
